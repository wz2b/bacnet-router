version: "3"

vars:
  APP_NAME: router
  BUILD_DIR: bin
  DIST_DIR: dist
  MAIN_PACKAGE: ./cmd/router

tasks:
  build:
    desc: Build the router executable for the host platform
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.APP_NAME}} {{.MAIN_PACKAGE}}

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} {{.DIST_DIR}}

  release:
    desc: Cross-compile a release artifact (set GOOS and GOARCH)
    requires:
      vars:
        - GOOS
        - GOARCH
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - |
        ext=""
        if [ "{{.GOOS}}" = "windows" ]; then
          ext=".exe"
        fi
        GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go build -o {{.DIST_DIR}}/{{.APP_NAME}}-{{.GOOS}}-{{.GOARCH}}${ext} {{.MAIN_PACKAGE}}

  ci:
    desc: Run CI checks
    deps:
      - test
      - build
